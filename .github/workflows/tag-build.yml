name: Tagged builds

on:
  push:
    tags: ['**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate repository documentation and helpers
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_repository.py
      - name: Require application source
        run: |
          if [[ ! -f go.mod || ! -d cmd/icloud-dl ]]; then
            echo '::error::Tagged builds require go.mod and cmd/icloud-dl. This repository currently contains the design kit only.'
            exit 1
          fi
      - name: Set up Go 1.27.3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting, build, tests and vet
        env:
          GOTOOLCHAIN: local
          GOEXPERIMENT: jsonv2
          GOFLAGS: -mod=readonly
        run: |
          unformatted="$(git ls-files -z -- '*.go' ':(exclude)vendor/**' | xargs -0 -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
          [[ "$(go env GOVERSION)" == go1.27.3 ]]
          go build ./...
          go test ./...
          go vet ./...

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-amd64
            goos: linux
            goarch: amd64
            suffix: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
          - target: macos-apple-silicon
            goos: darwin
            goarch: arm64
            suffix: ''
          - target: macos-intel
            goos: darwin
            goarch: amd64
            suffix: ''
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go 1.27.3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compile target
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOEXPERIMENT: jsonv2
          GOFLAGS: -mod=readonly
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          [[ "$(go env GOVERSION)" == go1.27.3 ]]
          mkdir -p build dist
          go build -trimpath -o "build/icloud-dl${BINARY_SUFFIX}" ./cmd/icloud-dl
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.goos }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          binary = Path('build') / ('icloud-dl' + os.environ['BINARY_SUFFIX'])
          name = 'icloud-dl-' + os.environ['TARGET']
          if os.environ['TARGET_OS'] == 'windows':
              archive = Path('dist') / (name + '.zip')
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
                  output.write(binary, arcname=binary.name)
          else:
              archive = Path('dist') / (name + '.tar.gz')
              with tarfile.open(archive, 'w:gz') as output:
                  output.add(binary, arcname=binary.name)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + '.sha256').write_text(
              checksum + '  ' + archive.name + '\n'
          )
          PY
      - name: Upload target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icloud-dl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
